<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<title>子云专属网站 · 管理员面板</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
:root{--bg-start:#f7faff;--bg-end:#eef3fc;--bg-radial:rgba(200,220,255,0.25);--card-bg:rgba(255,255,255,0.35);--card-border:rgba(255,255,255,0.5);--text1:#1b2b4a;--text2:#1d334f;--text3:#385578;--text4:#1f3a57;--inp-bg:rgba(255,255,255,0.4);--inp-bd:rgba(255,255,255,0.6);--inp-fc:rgba(255,255,255,0.7);--btn-bg:rgba(255,255,255,0.25);--btn-bd:rgba(255,255,255,0.6);--badge-bg:rgba(30,60,120,0.18);--sec-bg:rgba(255,255,255,0.25);--shadow:rgba(0,20,40,0.12);--toast-bg:rgba(30,50,80,0.85);--toast-c:#fff;--accent:#2a4b7a;--green:#2a7a4a;--red:#b13e3e;--gold:#b8862b;--particle:rgba(60,120,200,0.15)}
[data-theme="dark"]{--bg-start:#0d1a2b;--bg-end:#162235;--bg-radial:rgba(40,60,100,0.2);--card-bg:rgba(20,35,55,0.75);--card-border:rgba(80,120,180,0.25);--text1:#c8d8f0;--text2:#b0c8e0;--text3:#6a8aaa;--text4:#8aaccc;--inp-bg:rgba(40,60,90,0.5);--inp-bd:rgba(80,120,180,0.3);--inp-fc:rgba(60,90,130,0.6);--btn-bg:rgba(40,60,90,0.3);--btn-bd:rgba(80,120,180,0.25);--badge-bg:rgba(50,80,140,0.25);--sec-bg:rgba(30,50,80,0.25);--shadow:rgba(0,0,0,0.4);--toast-bg:rgba(10,20,40,0.92);--toast-c:#c8d8f0;--accent:#58a6ff;--green:#4a9a6a;--red:#d06a6a;--gold:#c8a060;--particle:rgba(80,140,220,0.12)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','PingFang SC',Roboto,sans-serif}
#particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
body{min-height:100vh;background:radial-gradient(circle at 20% 30%,var(--bg-radial),var(--bg-start)),linear-gradient(145deg,var(--bg-start)0%,var(--bg-end)100%);background-size:200% 200%;animation:bgShift 12s ease infinite;display:flex;justify-content:center;align-items:flex-start;padding:20px;color:var(--text1);position:relative;overflow-x:auto;padding-top:30px;padding-bottom:30px}
@keyframes bgShift{0%{background-position:0% 50%}25%{background-position:100% 0%}50%{background-position:50% 100%}75%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.glass-card{max-width:1300px;width:100%;background:var(--card-bg);backdrop-filter:blur(14px) saturate(180%);border-radius:56px;padding:2.2rem 2.5rem;box-shadow:0 30px 60px var(--shadow),0 8px 24px rgba(0,0,0,.03),inset 0 1px 2px rgba(255,255,255,.7);border:1px solid var(--card-border);position:relative;z-index:1;animation:fadeUp .7s ease-out}
.brand{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 20px;margin-bottom:1.2rem;border-bottom:1px solid rgba(255,255,255,.2);padding-bottom:1rem}
.brand h1{font-weight:500;font-size:2.4rem;letter-spacing:2px;color:var(--text1);display:flex;align-items:center;gap:12px}
.brand h1 i{color:var(--accent);font-size:2rem}
.theme-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.theme-btn{width:44px;height:24px;background:rgba(200,200,200,.3);border-radius:30px;border:none;cursor:pointer;padding:2px}
.theme-btn .dot{width:18px;height:18px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.theme-btn.dark .dot{transform:translateX(20px)}
.admin-badge{background:var(--badge-bg);padding:8px 20px;border-radius:60px;font-size:.95rem;font-weight:500;color:var(--text2);border:1px solid var(--card-border);display:flex;align-items:center;gap:10px;user-select:none}
.admin-badge .bc{cursor:pointer;display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:40px;transition:.2s}
.admin-badge .bc:hover{background:rgba(255,255,255,.2)}
.banner-wrap{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:1.5rem;align-items:stretch}
.welcome-banner{flex:2;min-width:240px;background:var(--sec-bg);border-radius:30px;padding:1rem 1.8rem;border:1px solid var(--card-border);display:flex;align-items:center;gap:16px}
.welcome-banner .wi{font-size:2rem;color:var(--accent);flex-shrink:0}
.welcome-banner .wt{flex:1}
.welcome-banner .wt .grt{font-size:1.1rem;font-weight:500;color:var(--text1)}
.welcome-banner .wt .sub{font-size:.85rem;color:var(--text3);opacity:.8;margin-top:2px}
.welcome-banner .wtime{font-size:.85rem;color:var(--text3);text-align:right;flex-shrink:0;white-space:nowrap}
.welcome-banner .wtime .td{font-weight:500;color:var(--text2)}
.status-cards{flex:1;min-width:200px;display:flex;gap:10px}
.status-card{flex:1;min-width:80px;background:var(--sec-bg);border-radius:24px;padding:.8rem 1.2rem;border:1px solid var(--card-border);text-align:center}
.status-card .si{font-size:1.2rem;margin-bottom:2px}
.status-card .si.g{color:var(--green)}
.status-card .si.y{color:var(--gold)}
.status-card .sn{font-size:1.4rem;font-weight:600;color:var(--text1)}
.status-card .sl{font-size:.7rem;color:var(--text3);opacity:.7}
.grid-2col{display:grid;grid-template-columns:1.2fr .9fr;gap:2.5rem;margin-top:.5rem}
.dl-section,.ac-section{background:var(--sec-bg);border-radius:36px;padding:1.8rem;border:1px solid var(--card-border)}
.dl-section h2,.ac-section h2{font-weight:400;font-size:1.6rem;color:var(--text2);display:flex;align-items:center;gap:12px;margin-bottom:.6rem}
.dl-desc{color:var(--text4);opacity:.9;margin-bottom:1.8rem;font-size:.98rem}
.dl-items{display:flex;flex-direction:column;gap:16px}
.dl-item{background:rgba(255,255,255,.15);border-radius:30px;padding:12px 22px;border:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dl-info{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dl-info i{font-size:1.6rem;color:var(--accent);width:30px}
.dl-link{display:inline-flex;align-items:center;gap:8px;background:var(--btn-bg);padding:8px 22px;border-radius:60px;color:var(--text2);font-weight:500;text-decoration:none;border:1px solid var(--btn-bd);cursor:pointer}
.dl-link:hover{background:var(--inp-fc)}
.fg{margin-bottom:16px;position:relative}
.fg label{display:block;font-size:.85rem;font-weight:500;color:var(--text2);margin-bottom:5px}
.fg input{width:100%;padding:14px 18px;background:var(--inp-bg);border:1px solid var(--inp-bd);border-radius:60px;font-size:1rem;color:var(--text1);outline:none;padding-right:48px}
.fg input:focus{background:var(--inp-fc);border-color:#6d93c9}
.pw-toggle{position:absolute;right:16px;bottom:14px;background:transparent;border:none;color:var(--text3);cursor:pointer;font-size:1rem;opacity:.6}
.fr{display:flex;gap:14px;flex-wrap:wrap}
.fr .fg{flex:1 0 120px}
.btn{padding:12px 24px;border-radius:60px;border:1px solid var(--btn-bd);background:var(--btn-bg);font-weight:500;font-size:1rem;color:var(--text2);cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;flex:1 1 auto}
.btn-p{background:rgba(50,100,180,.25);color:var(--accent)}
.btn-s{background:rgba(30,140,80,.2);color:var(--green)}
.btn-o{background:transparent}
.status-msg{margin-top:18px;padding:12px 18px;border-radius:60px;background:var(--sec-bg);border:1px solid var(--card-border);font-size:.95rem;color:var(--text2);min-height:52px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.contact-section{margin-top:1.2rem;padding:1.2rem;border-top:1px solid rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:30px}
.contact-items{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
.contact-item{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--text2);background:rgba(255,255,255,.2);padding:6px 18px;border-radius:40px;border:1px solid rgba(255,255,255,.3)}
.contact-item a{color:var(--text2);text-decoration:none}
.footer-note{margin-top:1.2rem;text-align:right;font-size:.8rem;color:var(--text3);opacity:.6;border-top:1px solid rgba(255,255,255,.2);padding-top:1rem}
.poem-bar{margin-top:.8rem;text-align:center;font-size:.85rem;color:var(--text4);opacity:.75;font-style:italic;padding:.6rem 0;border-top:1px solid rgba(255,255,255,.12);line-height:1.6}
.poem-bar i{opacity:.5;margin-right:6px}
.info-strip{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;padding:.8rem 0;margin-top:.6rem;font-size:.8rem;color:var(--text3);opacity:.65;border-top:1px solid rgba(255,255,255,.1)}
.info-strip span{display:inline-flex;align-items:center;gap:5px}

/* 管理员面板 */
.admin-panel{display:none;margin-top:1.2rem;background:rgba(255,255,255,.2);border-radius:40px;padding:1.8rem 2rem;border:1px solid var(--card-border)}
.admin-panel.active{display:block}
.admin-panel h3{font-weight:400;font-size:1.6rem;color:var(--text2);display:flex;align-items:center;gap:14px;margin-bottom:1.8rem;border-bottom:1px dashed rgba(255,255,255,.2);padding-bottom:.8rem}
.admin-panel h3 i{color:var(--gold)}
.admin-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:2rem}
.stat-card{background:var(--sec-bg);border-radius:24px;padding:.8rem 1rem;border:1px solid var(--card-border);text-align:center}
.stat-card i{font-size:1.6rem;color:var(--accent);display:block;margin-bottom:2px}
.stat-card .num{font-size:1.6rem;font-weight:500;color:var(--text1)}
.stat-card .lbl{font-size:.7rem;color:var(--text3);opacity:.8}
.admin-toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:1.2rem;align-items:center}
.search-box{flex:1;min-width:180px;display:flex;align-items:center;background:var(--inp-bg);border:1px solid var(--inp-bd);border-radius:60px;padding:0 18px}
.search-box input{flex:1;background:transparent;border:none;padding:10px 0;font-size:.9rem;color:var(--text1);outline:none}
.filter-group{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{padding:6px 16px;border-radius:40px;border:1px solid var(--btn-bd);background:var(--btn-bg);color:var(--text2);cursor:pointer;font-size:.8rem}
.filter-btn.active{background:rgba(50,100,180,.25);color:var(--accent)}
.log-table-wrap{overflow-x:auto;max-height:400px;overflow-y:auto;border-radius:24px;margin:.8rem 0}
.log-table,.admin-table{width:100%;border-collapse:collapse;font-size:.88rem}
.log-table th,.admin-table th{text-align:left;padding:10px 14px;background:rgba(255,255,255,.25);color:var(--text2);font-weight:500;border-bottom:1px solid rgba(255,255,255,.3)}
.log-table td,.admin-table td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.15);color:var(--text1);font-size:.85rem}
.edit-input{background:var(--inp-bg);border:1px solid var(--inp-bd);border-radius:40px;padding:6px 14px;font-size:.9rem;color:var(--text1);max-width:140px}
.badge-log{display:inline-block;padding:2px 12px;border-radius:40px;font-size:.7rem;font-weight:500}
.badge-log.login{background:rgba(42,122,74,.15);color:var(--green)}
.badge-log.register{background:rgba(42,95,138,.15);color:var(--accent)}
.badge-log.admin{background:rgba(184,134,43,.2);color:var(--gold)}
.badge-log.download{background:rgba(184,134,43,.15);color:var(--gold)}
.badge-log.delete{background:rgba(180,60,60,.15);color:var(--red)}
.badge-log.logout{background:rgba(180,60,60,.12);color:var(--red)}
.badge-log.update{background:rgba(42,122,74,.12);color:var(--green)}
.ip-tag{font-family:'Courier New',monospace;font-size:.8rem;opacity:.7}
.device-info{font-size:.75rem;opacity:.6}
.btn-sm{padding:6px 16px;font-size:.85rem;border-radius:40px;border:1px solid var(--btn-bd);background:var(--btn-bg);cursor:pointer;color:var(--text2)}
.btn-sm.danger{color:var(--red);border-color:rgba(180,70,50,.3)}
.recent-log{background:var(--sec-bg);border-radius:28px;padding:.8rem 1.5rem;margin-top:1.2rem;border:1px solid var(--card-border);font-size:.95rem;color:var(--text2)}
.recent-log i{margin-right:10px;color:var(--accent)}
.toast-message{position:fixed;top:30px;left:50%;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-c);padding:16px 32px;border-radius:60px;font-size:1rem;box-shadow:0 12px 40px rgba(0,0,0,.2);z-index:999;display:none;align-items:center;gap:14px}
.toast-message.show{display:flex}
.back-to-top{position:fixed;bottom:30px;right:30px;width:48px;height:48px;border-radius:50%;background:rgba(30,50,80,.7);color:#fff;border:none;cursor:pointer;font-size:1.2rem;display:none;align-items:center;justify-content:center;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.back-to-top.show{display:flex}
@media(max-width:820px){.glass-card{padding:1.5rem 1.2rem}.grid-2col{grid-template-columns:1fr;gap:2.2rem}.brand h1{font-size:2rem}}
@media(max-width:600px){.admin-stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<canvas id="particleCanvas"></canvas>
<div class="glass-card" id="app">
 <div class="brand">
  <h1><i class="fas fa-cloud"></i> 子云专属网站</h1>
  <div class="theme-wrap">
   <button class="theme-btn" id="themeToggle"><span class="dot" id="themeDot">🌙</span></button>
   <div class="admin-badge"><span class="bc" id="badgeClick"><i class="fas fa-user-shield"></i> <span id="badgeText">未登录</span> <i class="fas fa-crown" style="color:#c97d2b"></i></span></div>
  </div>
 </div>
 <div class="banner-wrap">
  <div class="welcome-banner">
   <div class="wi"><i class="fas fa-hand-peace"></i></div>
   <div class="wt"><div class="grt" id="greeting">👋 欢迎回来</div><div class="sub" id="subGreeting">一切在线 ✨</div></div>
   <div class="wtime"><div><i class="far fa-clock"></i> <span class="td" id="liveTime">--:--:--</span></div></div>
  </div>
  <div class="status-cards">
   <div class="status-card"><div class="si g"><i class="fas fa-server"></i></div><div class="sn">正常</div><div class="sl">系统</div></div>
   <div class="status-card"><div class="si g"><i class="fas fa-users"></i></div><div class="sn" id="onlineCount">1</div><div class="sl">在线</div></div>
  </div>
 </div>
 <div class="grid-2col" id="normalView">
  <div class="dl-section">
   <h2><i class="fas fa-download"></i> 下载中心</h2>
   <div class="dl-desc">登录后点击下载，跳转蓝奏云</div>
   <div class="dl-items">
    <div class="dl-item"><div class="dl-info"><i class="fas fa-file-archive"></i><span>子云工具包 v2.6</span></div><a href="#" class="dl-link" data-pkg="子云工具包 v2.6"><i class="fas fa-external-link-alt"></i> 下载</a></div>
    <div class="dl-item"><div class="dl-info"><i class="fas fa-code"></i><span>子云开发者套件</span></div><a href="#" class="dl-link" data-pkg="子云开发者套件"><i class="fas fa-external-link-alt"></i> 下载</a></div>
    <div class="dl-item"><div class="dl-info"><i class="fas fa-mobile-alt"></i><span>子云移动端</span></div><a href="#" class="dl-link" data-pkg="子云移动端"><i class="fas fa-external-link-alt"></i> 下载</a></div>
   </div>
  </div>
  <div class="ac-section">
   <h2><i class="fas fa-user-circle"></i> 账户</h2>
   <div class="fg"><label>用户名</label><input type="text" id="userInput" placeholder="请输入用户名"></div>
   <div class="fg"><label>密码</label><input type="password" id="passInput" placeholder="请输入密码"><button class="pw-toggle" id="pwToggle">👁️</button></div>
   <div class="fr">
    <div class="fg"><label>注册</label><button class="btn btn-s" id="regBtn"><i class="fas fa-pen"></i> 注册</button></div>
    <div class="fg"><label>登录</label><button class="btn btn-p" id="loginBtn"><i class="fas fa-sign-in-alt"></i> 登录</button></div>
   </div>
   <div class="status-msg" id="statusMessage"><i class="fas fa-comment-dots"></i> <span id="statusText">请输入用户名和密码</span></div>
   <div style="margin-top:12px"><button class="btn btn-o" id="logoutBtn" style="width:100%"><i class="fas fa-sign-out-alt"></i> 退出</button></div>
  </div>
 </div>
 <div class="admin-panel" id="adminPanel">
  <h3><i class="fas fa-sliders-h"></i> 管理员控制面板</h3>
  <div class="admin-stats">
   <div class="stat-card"><i class="fas fa-users"></i><div class="num" id="totalUsers">0</div><div class="lbl">总账户</div></div>
   <div class="stat-card"><i class="fas fa-user-check"></i><div class="num" id="recentLogins">0</div><div class="lbl">24h操作</div></div>
   <div class="stat-card"><i class="fas fa-tachometer-alt"></i><div class="num" id="trafficUsage">0 MB</div><div class="lbl">今日流量</div></div>
  </div>
  <div class="admin-toolbar">
   <div class="search-box"><i class="fas fa-search"></i><input type="text" id="logSearch" placeholder="搜索..."></div>
   <div class="filter-group" id="logFilters">
    <button class="filter-btn active" data-fl="all">全部</button>
    <button class="filter-btn" data-fl="login">登录</button>
    <button class="filter-btn" data-fl="register">注册</button>
    <button class="filter-btn" data-fl="admin">管理</button>
    <button class="filter-btn" data-fl="download">下载</button>
   </div>
  </div>
  <div style="margin:.8rem 0 .4rem;font-weight:500;color:var(--text2)"><i class="fas fa-edit"></i> 用户管理</div>
  <div id="userSelectWrap" style="margin-bottom:.8rem">
   <select id="userSelect" style="width:100%;padding:10px 14px;border-radius:20px;background:var(--inp-bg);border:1px solid var(--inp-bd);color:var(--text1);font-size:.95rem"><option value="">— 选择用户 —</option></select>
  </div>
  <div id="editForm" style="display:none;background:var(--sec-bg);border-radius:24px;padding:1.2rem 1.4rem;border:1px solid var(--card-border);margin-bottom:.8rem">
   <div class="fg"><label>用户名</label><input class="edit-input" id="editUser" placeholder="新用户名"></div>
   <div class="fg"><label>密码</label><input class="edit-input" id="editPass" placeholder="新密码" type="text"></div>
   <div class="fg"><label>角色</label><select id="editRole" style="width:100%;padding:10px 14px;border-radius:20px;background:var(--inp-bg);border:1px solid var(--inp-bd);color:var(--text1);font-size:.95rem"><option value="user">普通用户</option><option value="admin">管理员</option></select></div>
   <div class="fg flex" style="gap:10px">
    <button class="btn btn-p" id="editSaveBtn" style="flex:1"><i class="fas fa-check"></i> 保存</button>
    <button class="btn btn-o" id="editCancelBtn" style="flex:1"><i class="fas fa-times"></i> 取消</button>
   </div>
  </div>
  <div class="admin-table-wrap" style="margin-bottom:1.2rem"><table class="admin-table"><thead><tr><th>用户名</th><th>角色</th><th>操作</th></tr></thead><tbody id="userBody"></tbody></table></div>
  <hr style="border:none;border-top:1px solid var(--card-border);margin:.8rem 0">
  <div class="log-table-wrap"><table class="log-table"><thead><tr><th>时间</th><th>用户</th><th>操作</th><th>IP</th></tr></thead><tbody id="logBody"></tbody></table></div>
  <div class="recent-log"><i class="fas fa-history"></i> <span id="recentText">加载中...</span></div>
  <div style="margin-top:16px;display:flex;gap:12px;flex-wrap:wrap">
   <button class="btn btn-o" id="refreshBtn"><i class="fas fa-sync"></i> 刷新</button>
   <button class="btn btn-o" id="exitBtn"><i class="fas fa-arrow-left"></i> 返回</button>
  </div>
 </div>
 <div class="contact-section">
  <div class="contact-items">
   <div class="contact-item"><i class="fas fa-envelope"></i><a href="mailto:gym123vip123@163.com">gym123vip123@163.com</a></div>
   <div class="contact-item"><i class="fas fa-phone"></i><a href="tel:13738633585">13738633585</a></div>
  </div>
 </div>
 <div class="info-strip">
  <span><i class="fas fa-server"></i> 托管：Cloudflare Pages</span>
  <span><i class="fas fa-database"></i> 数据库：D1 SQLite</span>
  <span><i class="fas fa-globe-asia"></i> 节点：亚太地区</span>
  <span><i class="fas fa-code"></i> 前端：纯原生</span>
 </div>
 <div class="footer-note"><i class="fas fa-shield-alt"></i> 子云专属 · D1云端版</div>
 <div class="poem-bar" id="poemBar"><i class="fas fa-feather-alt"></i> <span id="poemText"></span></div>
</div>
<button class="back-to-top" id="backTop"><i class="fas fa-arrow-up"></i></button>
<div class="toast-message" id="toastMsg"><i class="fas fa-info-circle"></i> <span id="toastText">提示</span></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const API='/api';

// ---- 状态 ----
let token=localStorage.getItem('zy-t')||null;
let user=null;

// ---- API 请求 ----
async function call(path,opts){
 const h={'Content-Type':'application/json'};
 if(token)h['Authorization']='Bearer '+token;
 const r=await fetch(API+path,{...opts,headers:h});
 const d=await r.json();
 if(!r.ok)throw new Error(d.error||'请求失败');
 return d;
}

// ---- 恢复会话 ----
async function restore(){
 if(!token)return;
 try{
  const d=await call('/me');
  if(d.user){
   user=d.user;
   const suffix=user.role==='admin'?'（管理员）':'';
   status('👋 欢迎回来，'+user.username+suffix,'fa-check-circle','#2a7a4a');
  }
 }catch(e){
  token=null;localStorage.removeItem('zy-t');
 }
 ui();
}

// ---- Toast ----
let tt;
function toast(m,i,d){
 i=i||'fa-info-circle';d=d||3000;
 $('toastText').textContent=m;
 const e=$('toastMsg').querySelector('i');if(e)e.className='fas '+i;
 $('toastMsg').classList.add('show');
 clearTimeout(tt);tt=setTimeout(()=>$('toastMsg').classList.remove('show'),d);
}

function status(m,i,c){
 i=i||'fa-comment-dots';c=c||'var(--text2)';
 $('statusText').innerText=m;
 const e=$('statusMessage').querySelector('i');if(e)e.className='fas '+i;
 $('statusMessage').style.color=c;
}

// ---- 登录 / 注册 / 退出 ----
async function login(){
 const u=$('userInput').value.trim(),p=$('passInput').value.trim();
 if(!u||!p){status('⚠️ 请输入','fa-exclamation-triangle','#b5653b');return}
 try{
  const d=await call('/login',{method:'POST',body:JSON.stringify({username:u,password:p})});
  token=d.token;localStorage.setItem('zy-t',token);
  user={username:d.username,role:d.role};ui(true);
  $('passInput').value='';
  const suffix=user.role==='admin'?'（管理员）':'';
  status('👋 欢迎回来，'+user.username+suffix,'fa-check-circle','#2a7a4a');
  toast('✅ 登录成功','fa-check-circle',2000);
 }catch(e){status('❌ '+e.message,'fa-times-circle','#b13e3e')}
}

async function register(){
 const u=$('userInput').value.trim(),p=$('passInput').value.trim();
 if(!u||!p){status('⚠️ 请输入','fa-exclamation-triangle','#b5653b');return}
 if(u.length<3){status('⚠️ 至少3字符','fa-exclamation-triangle','#b5653b');return}
 try{
  await call('/register',{method:'POST',body:JSON.stringify({username:u,password:p})});
  status('✅ 注册成功，请登录','fa-check-circle','#2a7a4a');
  $('passInput').value='';toast('✅ 注册成功','fa-check-circle',2000);
 }catch(e){status('❌ '+e.message,'fa-times-circle','#b13e3e')}
}

async function logout(){
 try{if(token)await call('/logout',{method:'POST'})}catch(e){}
 token=null;localStorage.removeItem('zy-t');user=null;ui();
 status('🔓 已退出','fa-sign-out-alt','#4d6a8a');
 $('passInput').value='';toast('🔓 已退出','fa-sign-out-alt',2000);
}

// ---- 下载 ----
const FM={'子云工具包 v2.6':{path:'https://wwbhw.lanzouq.com/b01eunc61e'},'子云开发者套件':{path:'#'},'子云移动端':{path:'#'}};
document.querySelectorAll('.dl-link').forEach(l=>{
 l.addEventListener('click',function(e){
  e.preventDefault();
  if(!user){toast('🔒 请先登录','fa-lock',3000);return}
  const p=this.dataset.pkg;
  const info=FM[p];if(!info||info.path==='#'){toast('❌ 链接待配置','fa-exclamation-triangle',2000);return}
  toast('📦 跳转蓝奏云','fa-cloud',2000);
  window.open(info.path,'_blank');
 });
});

// ---- 主题 ----
const ttBtn=$('themeToggle'),td=$('themeDot');
let th=localStorage.getItem('zy-th')||'light';
if(window.matchMedia('(prefers-color-scheme:dark)').matches&&!localStorage.getItem('zy-th'))th='dark';
document.documentElement.setAttribute('data-theme',th);
ttBtn.classList.toggle('dark',th==='dark');
td.textContent=th==='dark'?'☀️':'🌙';
ttBtn.addEventListener('click',function(){
 const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
 document.documentElement.setAttribute('data-theme',n);
 localStorage.setItem('zy-th',n);
 this.classList.toggle('dark',n==='dark');
 td.textContent=n==='dark'?'☀️':'🌙';
 toast(n==='dark'?'🌙 深色':'☀️ 浅色','fa-palette',1500);
});

// ---- 时钟 ----
function clock(){
 const n=new Date();
 $('liveTime').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
 updateGreeting();
}
clock();setInterval(clock,1000);

// ---- 回到顶部 ----
const bt=$('backTop');
window.addEventListener('scroll',function(){bt.classList.toggle('show',window.scrollY>200)});
bt.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});

// ---- 在线模拟 ----
let oc=Math.floor(Math.random()*3)+1;
setInterval(()=>{
 oc=Math.max(1,oc+(Math.random()>.7?1:-1)*(Math.random()>.5?1:0));
 $('onlineCount').textContent=oc;
},5000);

// ---- 管理员面板 ----
let selectedUser=null;
let usersData=[];
async function loadAdmin(){
 if(!user||user.role!=='admin')return;
 try{
  const s=await call('/admin/stats');
  $('totalUsers').textContent=s.totalUsers;
  $('recentLogins').textContent=s.recentLogins;
  $('trafficUsage').textContent=(s.trafficToday/1024).toFixed(1)+' MB';
 }catch(e){}
 try{
  const d=await call('/admin/users');
  usersData=d.users||[];
  const sel=$('userSelect');
  sel.innerHTML='<option value="">— 选择用户 —</option>';
  const tb=$('userBody');tb.innerHTML='';
  usersData.forEach(u=>{
   sel.innerHTML+='<option value="'+u.username+'">'+u.username+' ('+(u.role||'user')+')</option>';
   const tr=document.createElement('tr');
   tr.className='user-row';tr.dataset.u=u.username;
   tr.innerHTML='<td>'+u.username+'</td><td>'+(u.role||'user')+'</td><td>'+(u.username!=='admin'?'<button class="btn-sm danger du" data-u="'+u.username+'">🗑️</button>':'—')+'</td>';
   tb.appendChild(tr);
  });
 }catch(e){}
 loadLogs();
}

function selectUser(name){
 selectedUser=name;
 if(!name){$('editForm').style.display='none';return}
 const d=usersData||[];
 const u=d.find(x=>x.username===name);
 if(!u)return;
 $('editUser').value=u.username||'';
 $('editPass').value=u.password||'';
 $('editRole').value=u.role||'user';
 $('editForm').style.display='block';
}

async function saveEdit(){
 if(!selectedUser)return;
 try{
  const nu=$('editUser').value.trim();
  const p=$('editPass').value.trim();
  const r=$('editRole').value;
  if(!nu||nu.length<3){toast('❌ 用户名至少3个字符','fa-times-circle',2000);return}
  await call('/admin/users/'+encodeURIComponent(selectedUser),{method:'PUT',body:JSON.stringify({newUser:nu,password:p,role:r})});
  toast('✅ 已保存','fa-check-circle',1500);
  $('editForm').style.display='none';
  selectedUser=null;
  loadAdmin();
 }catch(e){toast('❌ '+e.message,'fa-times-circle',2000)}
}

async function loadLogs(f){
 f=f||'all';
 try{
  const d=await call('/admin/logs?filter='+f);
  const tb=$('logBody');tb.innerHTML='';
  const am={login:'登录',logout:'退出',register:'注册',download:'下载',admin:'管理',delete:'删除',update:'修改'};
  let logs=d.logs||[];
  const s=$('logSearch').value.trim();
  if(s)logs=logs.filter(e=>e.username.includes(s)||(e.ip||'').includes(s));
  if(!logs.length){tb.innerHTML='<tr><td colspan="4" style="text-align:center;padding:2rem;opacity:.5">暂无日志</td></tr>';$('recentText').textContent='暂无记录';return}
  logs.forEach(e=>{
   let t;try{t=new Date(e.created_at).toLocaleString('zh-CN',{hour12:false})}catch(ex){t=e.created_at||'-'}
   const tr=document.createElement('tr');
   tr.innerHTML='<td>'+t+'</td><td>'+e.username+'</td><td><span class="badge-log '+e.action+'">'+(am[e.action]||e.action)+'</span></td><td><span class="ip-tag">'+(e.ip||'-')+'</span></td>';
   tb.appendChild(tr);
  });
  $('recentText').textContent='最近: '+logs.slice(0,3).map(e=>e.username+' ('+(am[e.action]||e.action)+')').join('; ');
 }catch(e){}
}

async function delUser(u){
 if(!confirm('删除 '+u+'？'))return;
 try{await call('/admin/users/'+encodeURIComponent(u),{method:'DELETE'});toast('🗑️ 已删除','fa-trash',1500);loadAdmin()}catch(e){toast('❌ '+e.message,'fa-times-circle',2000)}
}

// ---- UI 更新 ----
function updateGreeting(){
 const n=new Date();
 const h=n.getHours();let g='下午好';
 if(h>=5&&h<12)g='早上好';else if(h>=12&&h<14)g='中午好';else if(h>=18)g='晚上好';
 const un=user?user.username:'子云';
 const suffix=user&&user.role==='admin'?'（管理员）':'';
 $('greeting').textContent='👋 '+g+'，'+un+suffix;
}

function ui(autoAdmin){
 if(user){
  const a=user.role==='admin';
  $('badgeText').textContent=a?'管理员':user.username;
  updateGreeting();
  if(a&&autoAdmin){$('adminPanel').classList.add('active');$('normalView').style.display='none';loadAdmin()}
  else{$('adminPanel').classList.remove('active');$('normalView').style.display='grid'}
  $('passInput').value='';
 }else{
  $('badgeText').textContent='未登录';
  $('adminPanel').classList.remove('active');$('normalView').style.display='grid';
  status('🔓 请输入用户名和密码','fa-comment-dots','#4d6a8a');
 }
}

// ---- 事件绑定 ----
$('loginBtn').onclick=e=>{e.preventDefault();login()};
$('regBtn').onclick=e=>{e.preventDefault();register()};
$('logoutBtn').onclick=e=>{e.preventDefault();logout()};
$('passInput').onkeypress=e=>{if(e.key==='Enter')login()};
$('userInput').onkeypress=e=>{if(e.key==='Enter')login()};
$('pwToggle').onclick=function(){
 const v=$('passInput').type==='text';
 $('passInput').type=v?'password':'text';
 this.textContent=v?'👁️':'👁️‍🗨️';
};
$('badgeClick').onclick=function(){
 if(user&&user.role==='admin'){
  if($('adminPanel').classList.contains('active')){toast('📍 已在控制台','fa-info-circle',1500);return}
  $('adminPanel').classList.add('active');$('normalView').style.display='none';loadAdmin();
  toast('📍 控制台','fa-sliders-h',2000);
 }else{toast('⛔ 需管理员登录','fa-exclamation-triangle',2000)}
};
$('exitBtn').onclick=function(){
 $('adminPanel').classList.remove('active');$('normalView').style.display='grid';
 status('👤 返回','fa-arrow-left','#1f5a7a');
};
$('refreshBtn').onclick=function(){if(user&&user.role==='admin'){loadAdmin();toast('🔄 已刷新','fa-sync',1500)}else{toast('⛔ 请登录','fa-exclamation-triangle',2000)}};
$('logSearch').oninput=function(){const af=document.querySelector('#logFilters .filter-btn.active');loadLogs(af?af.dataset.fl:'all')};
document.querySelectorAll('#logFilters .filter-btn').forEach(b=>{
 b.onclick=function(){
  document.querySelectorAll('#logFilters .filter-btn').forEach(x=>x.classList.remove('active'));this.classList.add('active');
  loadLogs(this.dataset.fl);
 }
});
// 用户表事件委托
$('userSelect').onchange=function(){selectUser(this.value)};
$('editSaveBtn').onclick=function(){saveEdit()};
$('editCancelBtn').onclick=function(){$('editForm').style.display='none';selectedUser=null};
$('userBody').onclick=function(e){
 const t=e.target.closest('button');if(!t)return;
 if(t.classList.contains('du'))delUser(t.dataset.u);
};

// ---- 每日古诗 ----
const poems=[
 '路漫漫其修远兮，吾将上下而求索。——屈原《离骚》',
 '天行健，君子以自强不息。——《周易》',
 '长风破浪会有时，直挂云帆济沧海。——李白《行路难》',
 '海内存知己，天涯若比邻。——王勃《送杜少府之任蜀州》',
 '会当凌绝顶，一览众山小。——杜甫《望岳》',
 '问渠那得清如许？为有源头活水来。——朱熹《观书有感》',
 '纸上得来终觉浅，绝知此事要躬行。——陆游《冬夜读书示子聿》',
 '大鹏一日同风起，扶摇直上九万里。——李白《上李邕》',
 '山重水复疑无路，柳暗花明又一村。——陆游《游山西村》',
 '人生自古谁无死？留取丹心照汗青。——文天祥《过零丁洋》',
 '千淘万漉虽辛苦，吹尽狂沙始到金。——刘禹锡《浪淘沙》',
 '但愿人长久，千里共婵娟。——苏轼《水调歌头》',
 '莫愁前路无知己，天下谁人不识君。——高适《别董大》',
 '宝剑锋从磨砺出，梅花香自苦寒来。——《警世贤文》',
 '业精于勤，荒于嬉；行成于思，毁于随。——韩愈《进学解》',
 '非淡泊无以明志，非宁静无以致远。——诸葛亮《诫子书》',
 '黑发不知勤学早，白首方悔读书迟。——颜真卿《劝学》',
 '读书破万卷，下笔如有神。——杜甫《奉赠韦左丞丈二十二韵》',
 '博观而约取，厚积而薄发。——苏轼《稼说送张琥》',
 '学而不思则罔，思而不学则殆。——《论语》',
 '温故而知新，可以为师矣。——《论语》',
 '三人行，必有我师焉。——《论语》',
 '知之者不如好之者，好之者不如乐之者。——《论语》',
 '己所不欲，勿施于人。——《论语》',
 '有志者，事竟成。——《后汉书》',

 '天将降大任于是人也，必先苦其心志，劳其筋骨。——《孟子》',
 '穷则独善其身，达则兼济天下。——《孟子》',
 '老当益壮，宁移白首之心？穷且益坚，不坠青云之志。——王勃《滕王阁序》',
 '落霞与孤鹜齐飞，秋水共长天一色。——王勃《滕王阁序》',
];
(function(){
 const n=new Date();
 const dayKey=n.getFullYear()*10000+(n.getMonth()+1)*100+n.getDate();
 const idx=dayKey%poems.length;
 $('poemText').textContent=poems[idx];
})();

// ---- 粒子动效 ----
(function(){
 const c=$('particleCanvas'),ctx=c.getContext('2d');
 let w,h,particles=[];
 function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
 resize();
 window.addEventListener('resize',resize);
 const count=Math.min(80,Math.floor(w*h/12000));
 for(let i=0;i<count;i++){
  particles.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r:Math.random()*2.5+1});
 }
 const isDark=()=>document.documentElement.getAttribute('data-theme')==='dark';
 function draw(){
  ctx.clearRect(0,0,w,h);
  const alpha=isDark()?.12:.1;
  for(let p of particles){
   p.x+=p.vx;p.y+=p.vy;
   if(p.x<0)p.x=w;if(p.x>w)p.x=0;
   if(p.y<0)p.y=h;if(p.y>h)p.y=0;
   ctx.beginPath();
   ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
   ctx.fillStyle='rgba(100,160,255,'+alpha+')';
   ctx.fill();
  }
  for(let i=0;i<particles.length;i++){
   for(let j=i+1;j<particles.length;j++){
    const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<150){
     ctx.beginPath();
     ctx.moveTo(particles[i].x,particles[i].y);
     ctx.lineTo(particles[j].x,particles[j].y);
     ctx.strokeStyle='rgba(100,160,255,'+(alpha*(1-dist/150))+')';
     ctx.lineWidth=.5;
     ctx.stroke();
    }
   }
  }
  requestAnimationFrame(draw);
 }
 draw();
})();

restore().then(()=>{if(!user)status('🔓 请输入用户名和密码','fa-comment-dots','#4d6a8a')});
console.log('[子云] 云端版 D1 已加载');
console.log('[子云] 管理员: admin / admin123');
})();
