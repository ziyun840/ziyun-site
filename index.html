<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
<title>子云专属网站 · 管理员面板</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>\n:root {
  --bg0: #04080d; --bg1: #0b121c; --bg2: #0f1a2a; --bg3: #142335;
  --accent1: #4fc3f7; --accent2: #7c4dff; --accent3: #00e5ff;
  --gold: #ffd54f; --green: #69f0ae; --red: #ff5252;
  --card-alpha: 0.55; --border-alpha: 0.18; --glow-alpha: 0.12;
}
[data-theme='light'] {
  --bg0: #f0f4ff; --bg1: #e8eef8; --bg2: #dce4f0; --bg3: #d0dae8;
  --accent1: #1976d2; --accent2: #7c4dff; --accent3: #00897b;
  --gold: #f9a825; --green: #2e7d32; --red: #c62828;
  --card-alpha: 0.6; --border-alpha: 0.12; --glow-alpha: 0.06;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI','PingFang SC',system-ui,sans-serif}
::selection{background:rgba(79,195,247,.3);color:#fff}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22)}
#particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.6}
body{min-height:100vh;background:radial-gradient(ellipse 60% 40% at 20% 10%,rgba(79,195,247,.06),transparent),radial-gradient(ellipse 50% 50% at 80% 30%,rgba(124,77,255,.05),transparent),radial-gradient(ellipse 40% 60% at 50% 80%,rgba(0,229,255,.04),transparent),linear-gradient(165deg,var(--bg0),var(--bg1) 40%,var(--bg2) 70%,var(--bg3) 100%);display:flex;justify-content:center;align-items:flex-start;padding:24px;color:#e0e8f0;position:relative;overflow-x:auto;padding-top:32px;padding-bottom:40px}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(1px 1px at 10% 20%,rgba(79,195,247,.3),transparent),radial-gradient(1px 1px at 30% 60%,rgba(124,77,255,.25),transparent),radial-gradient(1px 1px at 50% 10%,rgba(0,229,255,.2),transparent),radial-gradient(1px 1px at 70% 40%,rgba(79,195,247,.15),transparent),radial-gradient(1px 1px at 90% 70%,rgba(124,77,255,.2),transparent);background-size:200px 200px;pointer-events:none;z-index:0;animation:starDrift 30s linear infinite}
@keyframes starDrift{0%{transform:translateY(0)}100%{transform:translateY(-200px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
.glass-card{max-width:1320px;width:100%;background:rgba(15,26,42,var(--card-alpha));-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-radius:64px;padding:2.4rem 2.8rem;box-shadow:0 4px 32px rgba(0,0,0,.4),0 0 0 1px rgba(79,195,247,var(--border-alpha)),inset 0 1px 0 rgba(255,255,255,.06);position:relative;z-index:1;animation:fadeUp .6s ease-out;overflow:hidden}
.glass-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 100% 60% at 0% 0%,rgba(79,195,247,.04),transparent),radial-gradient(ellipse 80% 80% at 100% 100%,rgba(124,77,255,.04),transparent);pointer-events:none;z-index:-1}
[data-theme='light'] .glass-card{background:rgba(220,228,240,var(--card-alpha))}
.brand{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 20px;margin-bottom:1.2rem;padding-bottom:1rem;border-bottom:1px solid rgba(79,195,247,.1)}
.brand h1{font-weight:700;font-size:2.2rem;letter-spacing:-.5px;background:linear-gradient(135deg,#4fc3f7,#7c4dff 50%,#00e5ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:flex;align-items:center;gap:14px}
.brand h1 i{-webkit-text-fill-color:initial;color:#4fc3f7;font-size:1.8rem;filter:drop-shadow(0 0 8px rgba(79,195,247,.4))}
.theme-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:relative}
.theme-btn{width:44px;height:26px;background:rgba(200,220,255,.15);border-radius:30px;border:1px solid rgba(255,255,255,.1);cursor:pointer;padding:2px;transition:.3s}
.theme-btn .dot{width:20px;height:20px;background:linear-gradient(135deg,#4fc3f7,#7c4dff);border-radius:50%;transition:.3s cubic-bezier(.4,0,.2,1);box-shadow:0 2px 8px rgba(79,195,247,.3)}
.theme-btn.dark{background:rgba(79,195,247,.15)}
.theme-btn.dark .dot{transform:translateX(18px)}
.admin-badge{background:rgba(79,195,247,.08);padding:6px 18px;border-radius:60px;font-size:.9rem;font-weight:500;color:var(--accent1);border:1px solid rgba(79,195,247,.15);display:flex;align-items:center;gap:10px;user-select:none}
.admin-badge .bc{cursor:pointer;display:flex;align-items:center;gap:8px;padding:4px 6px 4px 4px;border-radius:40px;transition:.2s}
.admin-badge .bc:hover{background:rgba(79,195,247,.1)}
.banner-wrap{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:1.6rem;align-items:stretch}
.welcome-banner{flex:2;min-width:240px;background:linear-gradient(135deg,rgba(79,195,247,.06),rgba(124,77,255,.04));border-radius:28px;padding:1rem 1.6rem;border:1px solid rgba(79,195,247,.1);display:flex;align-items:center;gap:14px;transition:.3s}
.welcome-banner:hover{border-color:rgba(79,195,247,.2);box-shadow:0 0 20px rgba(79,195,247,.05)}
.welcome-banner .wi{font-size:1.8rem;color:var(--accent1);flex-shrink:0}
.welcome-banner .wt{flex:1}
.welcome-banner .wt .grt{font-size:1.05rem;font-weight:600;color:#e0e8f0}
.welcome-banner .wt .sub{font-size:.8rem;color:rgba(160,180,210,.7);margin-top:2px}
.welcome-banner .wtime{font-size:.82rem;color:rgba(160,180,210,.6);text-align:right;flex-shrink:0;white-space:nowrap}
.welcome-banner .wtime .td{font-weight:600;color:#90c8f8;letter-spacing:.5px}
[data-theme='light'] .welcome-banner .wt .grt{color:#1a2a4a}
[data-theme='light'] .welcome-banner .wt .sub{color:#4a6a8a}
[data-theme='light'] .welcome-banner .wtime{color:#5a7a9a}
[data-theme='light'] .welcome-banner .wtime .td{color:#1a4a7a}
.status-cards{flex:1;min-width:200px;display:flex;gap:10px}
.status-card{flex:1;min-width:80px;background:rgba(255,255,255,.04);border-radius:20px;padding:.7rem 1rem;border:1px solid rgba(255,255,255,.06);text-align:center;transition:.25s ease;position:relative;overflow:hidden}
.status-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent1),transparent);opacity:0;transition:.3s}
.status-card:hover::after{opacity:1}
.status-card:hover{transform:translateY(-2px);background:rgba(255,255,255,.06)}
.status-card .si{font-size:1.1rem;margin-bottom:2px}
.status-card .si.g{color:var(--green)}.status-card .si.y{color:var(--gold)}
.status-card .sn{font-size:1.3rem;font-weight:700;color:#e0e8f0}
.status-card .sl{font-size:.65rem;color:rgba(160,180,210,.6)}
[data-theme='light'] .status-card{background:rgba(255,255,255,.15)}
[data-theme='light'] .status-card .sn{color:#1a2a4a}
.grid-2col{display:grid;grid-template-columns:1.2fr .9fr;gap:2.2rem;margin-top:.5rem}
.dl-section,.ac-section{background:rgba(255,255,255,.03);border-radius:32px;padding:1.6rem;border:1px solid rgba(79,195,247,.08);backdrop-filter:blur(8px);transition:.3s}
.dl-section:hover,.ac-section:hover{border-color:rgba(79,195,247,.15)}
.dl-section h2,.ac-section h2{font-weight:600;font-size:1.4rem;color:#b0d0f0;display:flex;align-items:center;gap:12px;margin-bottom:.5rem}
.dl-section h2 i{color:var(--accent1);font-size:1.2rem}
.ac-section h2 i{color:var(--accent2);font-size:1.2rem}
.dl-desc{color:rgba(160,180,210,.6);margin-bottom:1.5rem;font-size:.9rem}
.dl-items{display:flex;flex-direction:column;gap:14px}
.dl-item{background:rgba(255,255,255,.04);border-radius:28px;padding:10px 20px;border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;transition:.25s ease}
.dl-item:hover{background:rgba(255,255,255,.07);border-color:rgba(79,195,247,.15);transform:translateY(-1px)}
.dl-info{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dl-info i{font-size:1.4rem;width:28px;text-align:center}
.dl-item:nth-child(1) .dl-info i{color:var(--accent1)}
.dl-item:nth-child(2) .dl-info i{color:var(--green)}
.dl-item:nth-child(3) .dl-info i{color:var(--gold)}
.dl-link{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(79,195,247,.1),rgba(124,77,255,.05));padding:7px 20px;border-radius:60px;color:#b0d0f0;font-weight:500;text-decoration:none;border:1px solid rgba(79,195,247,.15);cursor:pointer;transition:.2s;font-size:.9rem}
.dl-link:hover{background:linear-gradient(135deg,rgba(79,195,247,.2),rgba(124,77,255,.1));transform:scale(1.03);box-shadow:0 4px 16px rgba(79,195,247,.1);color:#e0e8f0}
.fg{margin-bottom:14px;position:relative}
.fg label{display:block;font-size:.82rem;font-weight:500;color:#90b0d0;margin-bottom:4px;letter-spacing:.3px}
.fg input{width:100%;padding:12px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:60px;font-size:.95rem;color:#e0e8f0;outline:none;padding-right:44px;transition:.3s}
.fg input:focus{background:rgba(79,195,247,.06);border-color:rgba(79,195,247,.3);box-shadow:0 0 16px rgba(79,195,247,.06)}
.fg input::placeholder{color:rgba(160,180,210,.3)}
[data-theme='light'] .fg label{color:#3a5a7a}
[data-theme='light'] .fg input{background:rgba(255,255,255,.4);color:#1a2a4a;border-color:rgba(0,0,0,.1)}
[data-theme='light'] .fg input:focus{background:#fff;border-color:var(--accent1)}
.pw-toggle{position:absolute;right:14px;bottom:11px;background:transparent;border:none;color:rgba(160,180,210,.5);cursor:pointer;font-size:.95rem;transition:.2s}
.pw-toggle:hover{color:var(--accent1)}
.fr{display:flex;gap:14px;flex-wrap:wrap}
.fr .fg{flex:1 0 120px}
.btn{padding:11px 22px;border-radius:60px;border:1px solid rgba(79,195,247,.12);background:rgba(79,195,247,.06);font-weight:500;font-size:.95rem;color:#b0d0f0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;flex:1 1 auto;transition:.2s;box-shadow:0 0 16px transparent}
.btn:hover{background:rgba(79,195,247,.12);border-color:rgba(79,195,247,.25);transform:translateY(-1px);color:#e0e8f0;box-shadow:0 0 20px rgba(79,195,247,.06)}
.btn:active{transform:translateY(0)}
.btn-p{background:linear-gradient(135deg,rgba(79,195,247,.15),rgba(124,77,255,.08));color:#4fc3f7}
.btn-p:hover{background:linear-gradient(135deg,rgba(79,195,247,.25),rgba(124,77,255,.15))}
.btn-s{background:rgba(105,240,174,.08);color:var(--green);border-color:rgba(105,240,174,.12)}
.btn-s:hover{background:rgba(105,240,174,.15);border-color:rgba(105,240,174,.25)}
.btn-o{background:transparent}
.btn-o:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.status-msg{margin-top:18px;padding:12px 18px;border-radius:60px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);font-size:.9rem;color:#b0d0f0;min-height:48px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.contact-section{margin-top:1.2rem;padding:1rem 1.2rem;background:rgba(255,255,255,.02);border-radius:28px;display:flex;flex-direction:column;align-items:center;gap:10px}
.contact-items{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.contact-item{display:flex;align-items:center;gap:8px;font-size:.85rem;color:#90b0d0;background:rgba(255,255,255,.04);padding:5px 16px;border-radius:40px;border:1px solid rgba(255,255,255,.06);transition:.2s}
.contact-item:hover{background:rgba(79,195,247,.06);border-color:rgba(79,195,247,.15)}
.contact-item a{color:#90b0d0;text-decoration:none}
.contact-item a:hover{color:var(--accent1)}
.footer-note{margin-top:1.2rem;text-align:right;font-size:.78rem;color:rgba(160,180,210,.4);border-top:1px solid rgba(255,255,255,.05);padding-top:.8rem}
.poem-bar{margin-top:.7rem;text-align:center;font-size:.82rem;color:rgba(160,180,210,.5);font-style:italic;padding:.5rem 0;border-top:1px solid rgba(255,255,255,.04);line-height:1.6}
.poem-bar i{opacity:.4;margin-right:6px}
.info-strip{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;padding:.6rem 0;margin-top:.5rem;font-size:.78rem;color:rgba(160,180,210,.4);border-top:1px solid rgba(255,255,255,.04)}
.info-strip span{display:inline-flex;align-items:center;gap:5px}
.admin-panel{display:none;margin-top:1.2rem;animation:fadeUp .4s ease-out}
.admin-panel.active{display:block}
.admin-panel h3{font-weight:600;font-size:1.5rem;background:linear-gradient(135deg,#4fc3f7,#7c4dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:flex;align-items:center;gap:14px;margin-bottom:1.6rem;border-bottom:1px solid rgba(79,195,247,.08);padding-bottom:.7rem}
.admin-panel h3 i{-webkit-text-fill-color:initial;color:#4fc3f7;font-size:1.3rem}
.admin-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:1.8rem}
.stat-card{background:rgba(255,255,255,.04);border-radius:20px;padding:.9rem 1.2rem .8rem;border:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:4px;transition:.3s;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#4fc3f7,transparent);opacity:0;transition:.3s}
.stat-card:hover{border-color:rgba(79,195,247,.2);transform:translateY(-2px)}
.stat-card:hover::before{opacity:.6}
.stat-head{display:flex;align-items:center;gap:8px;font-size:.8rem;color:rgba(160,180,210,.6)}
.stat-head i{font-size:.85rem;color:var(--accent1);width:16px;text-align:center}
.stat-value{font-size:1.4rem;font-weight:700;color:#e0e8f0;line-height:1.2}
.stat-value small{font-size:.7rem;font-weight:400;color:rgba(160,180,210,.5);margin-left:3px}
.stat-bar{height:3px;background:rgba(128,128,128,.08);border-radius:4px;overflow:hidden;margin-top:3px}
.stat-bar-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
[data-theme='light'] .stat-card{background:rgba(255,255,255,.2);border-color:rgba(0,0,0,.06)}
[data-theme='light'] .stat-value{color:#1a2a4a}
.admin-toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:1rem;align-items:center}
.search-box{flex:1;min-width:180px;display:flex;align-items:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:60px;padding:0 16px;transition:.3s}
.search-box:focus-within{border-color:rgba(79,195,247,.2);background:rgba(79,195,247,.04)}
.search-box input{flex:1;background:transparent;border:none;padding:9px 0;font-size:.88rem;color:#e0e8f0;outline:none}
.search-box input::placeholder{color:rgba(160,180,210,.3)}
.search-box i{color:rgba(160,180,210,.3);font-size:.85rem}
[data-theme='light'] .search-box input{color:#1a2a4a}
[data-theme='light'] .search-box{background:rgba(255,255,255,.3)}
.filter-group{display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border-radius:40px;border:1px solid rgba(255,255,255,.06);background:transparent;color:#90b0d0;cursor:pointer;font-size:.78rem;transition:.2s}
.filter-btn:hover{background:rgba(79,195,247,.06);border-color:rgba(79,195,247,.12)}
.filter-btn.active{background:rgba(79,195,247,.1);color:var(--accent1);border-color:rgba(79,195,247,.15)}
.log-table-wrap{overflow-x:auto;max-height:400px;overflow-y:auto;border-radius:16px;margin:.8rem 0;border:1px solid rgba(255,255,255,.04);background:rgba(255,255,255,.015)}
.log-table,.admin-table{width:100%;border-collapse:collapse;font-size:.85rem}
.log-table th,.admin-table th{text-align:left;padding:10px 14px;background:rgba(79,195,247,.04);color:#90b0d0;font-weight:500;font-size:.78rem;border-bottom:1px solid rgba(79,195,247,.06);letter-spacing:.3px}
.log-table td,.admin-table td{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.03);color:#c8d8e8;font-size:.82rem}
.log-table tr:hover td,.admin-table tr:hover td{background:rgba(79,195,247,.02)}
[data-theme='light'] .log-table th,.admin-table th{background:rgba(0,0,0,.03);color:#3a5a7a}
[data-theme='light'] .log-table td,.admin-table td{color:#1a3a5a}
.edit-input{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:40px;padding:6px 12px;font-size:.85rem;color:#e0e8f0;max-width:140px;outline:none;transition:.2s}
.edit-input:focus{border-color:rgba(79,195,247,.25);background:rgba(79,195,247,.04)}
.badge-log{display:inline-block;padding:2px 10px;border-radius:40px;font-size:.65rem;font-weight:600;letter-spacing:.3px}
.badge-log.login{background:rgba(105,240,174,.08);color:var(--green)}
.badge-log.register{background:rgba(79,195,247,.08);color:var(--accent1)}
.badge-log.admin{background:rgba(255,213,79,.08);color:var(--gold)}
.badge-log.download{background:rgba(255,213,79,.06);color:var(--gold)}
.badge-log.delete{background:rgba(255,82,82,.08);color:var(--red)}
.badge-log.logout{background:rgba(255,82,82,.06);color:var(--red)}
.badge-log.update{background:rgba(105,240,174,.06);color:var(--green)}
.ip-tag{font-family:'IBM Plex Mono','Courier New',monospace;font-size:.78rem;opacity:.5}
.device-info{font-size:.72rem;opacity:.4}
.btn-sm{padding:5px 14px;font-size:.82rem;border-radius:40px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);cursor:pointer;color:#90b0d0;transition:.2s}
.btn-sm:hover{background:rgba(79,195,247,.06);border-color:rgba(79,195,247,.12)}
.btn-sm.danger{color:var(--red);border-color:rgba(255,82,82,.15)}
.btn-sm.danger:hover{background:rgba(255,82,82,.08);border-color:rgba(255,82,82,.25)}
.btn-sm.su{color:var(--accent1);border-color:rgba(79,195,247,.1)}
.btn-sm.su:hover{background:rgba(79,195,247,.08);border-color:rgba(79,195,247,.2)}
.recent-log{background:rgba(255,255,255,.03);border-radius:24px;padding:.7rem 1.4rem;margin-top:1rem;border:1px solid rgba(255,255,255,.04);font-size:.9rem;color:#90b0d0}
.recent-log i{margin-right:10px;color:var(--accent1)}
.toast-message{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:rgba(10,18,30,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#b0d8ff;padding:14px 28px;border-radius:60px;font-size:.92rem;box-shadow:0 8px 32px rgba(0,0,0,.3),0 0 0 1px rgba(79,195,247,.08);z-index:9999;display:none;align-items:center;gap:12px;white-space:nowrap}
.toast-message.show{display:flex;animation:fadeUp .2s ease-out}
.back-to-top{position:fixed;bottom:30px;right:30px;width:44px;height:44px;border-radius:50%;background:rgba(15,26,42,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#b0d0f0;border:1px solid rgba(79,195,247,.1);cursor:pointer;font-size:1.1rem;display:none;align-items:center;justify-content:center;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.2);transition:.3s}
.back-to-top.show{display:flex}
.back-to-top.show:hover{transform:translateY(-2px);background:rgba(20,35,55,.9);border-color:rgba(79,195,247,.2)}
.float-exit{position:fixed !important;bottom:90px;right:30px;width:44px;height:44px;border-radius:50%;background:rgba(15,26,42,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#b0d0f0;border:1px solid rgba(79,195,247,.1);cursor:grab;font-size:1.1rem;display:none;align-items:center;justify-content:center;z-index:999999;box-shadow:0 4px 20px rgba(0,0,0,.2);transition:.3s;user-select:none}
.float-exit.show{display:flex}

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const API='/api';

// ---- 状态 ----
let token=localStorage.getItem('zy-t')||null;
let user=null;

// ---- API 请求 ----
async function call(path,opts){
 const h={'Content-Type':'application/json'};
 if(token)h['Authorization']='Bearer '+token;
 const r=await fetch(API+path,{...opts,headers:h});
 const d=await r.json();
 if(!r.ok)throw new Error(d.error||'请求失败');
 return d;
}

// ---- 恢复会话 ----
async function restore(){
 if(!token)return;
 try{
  const d=await call('/me');
  if(d.user){
   user=d.user;
   const suffix=user.role==='admin'?'（管理员）':'';
   status('👋 欢迎回来，'+user.username+suffix,'fa-check-circle','#2a7a4a');
  }
 }catch(e){
  token=null;localStorage.removeItem('zy-t');
 }
 ui();
}

// ---- Toast ----
let tt;
function toast(m,i,d){
 i=i||'fa-info-circle';d=d||3000;
 $('toastText').textContent=m;
 const e=$('toastMsg').querySelector('i');if(e)e.className='fas '+i;
 $('toastMsg').classList.add('show');
 clearTimeout(tt);tt=setTimeout(()=>$('toastMsg').classList.remove('show'),d);
}

function status(m,i,c){
 i=i||'fa-comment-dots';c=c||'var(--text2)';
 $('statusText').innerText=m;
 const e=$('statusMessage').querySelector('i');if(e)e.className='fas '+i;
 $('statusMessage').style.color=c;
}

// ---- 登录 / 注册 / 退出 ----
async function login(){
 const u=$('userInput').value.trim(),p=$('passInput').value.trim();
 if(!u||!p){status('⚠️ 请输入','fa-exclamation-triangle','#b5653b');return}
 if(user){status('⚠️ 请先退出当前账号再进行登录','fa-exclamation-triangle','#b5653b');toast('⚠️ 请先退出再登录','fa-exclamation-triangle',2500);return}
 try{
  const d=await call('/login',{method:'POST',body:JSON.stringify({username:u,password:p})});
  token=d.token;localStorage.setItem('zy-t',token);
  user={username:d.username,role:d.role};ui(true);
  $('passInput').value='';
  const suffix=user.role==='admin'?'（管理员）':'';
  status('👋 欢迎回来，'+user.username+suffix,'fa-check-circle','#2a7a4a');
  toast('✅ 登录成功','fa-check-circle',2000);
 }catch(e){status('❌ '+e.message,'fa-times-circle','#b13e3e')}
}

async function register(){
 const u=$('userInput').value.trim(),p=$('passInput').value.trim();
 if(!u||!p){status('⚠️ 请输入','fa-exclamation-triangle','#b5653b');return}
 if(u.length<3){status('⚠️ 至少3字符','fa-exclamation-triangle','#b5653b');return}
 try{
  await call('/register',{method:'POST',body:JSON.stringify({username:u,password:p})});
  status('✅ 注册成功，请登录','fa-check-circle','#2a7a4a');
  $('passInput').value='';toast('✅ 注册成功','fa-check-circle',2000);
 }catch(e){status('❌ '+e.message,'fa-times-circle','#b13e3e')}
}

async function logout(){
 try{if(token)await call('/logout',{method:'POST'})}catch(e){}
 token=null;localStorage.removeItem('zy-t');user=null;ui();
 status('🔓 已退出','fa-sign-out-alt','#4d6a8a');
 $('passInput').value='';toast('🔓 已退出','fa-sign-out-alt',2000);
}

// ---- 下载 ----
let dlData=[];
async function loadDownloads(adminMode){
 try{
  const ep=adminMode?'/admin/downloads':'/downloads';
  const d=await call(ep);
  dlData=d.downloads||[];
  const list=$('downloadList');list.innerHTML='';
  const icons=['fa-file-archive','fa-code','fa-mobile-alt','fa-cloud','fa-tools','fa-link','fa-cog','fa-star'];
  dlData.forEach((item,i)=>{
   const icon=icons[i%icons.length];
   const hasUrl=item.url&&item.url!=='#';
   const enabled=item.enabled===undefined||item.enabled===1||item.enabled===true;
   const disabledCls=enabled?'':' style="opacity:.45"';
   const badge=enabled?'':' <span style="font-size:.7rem;background:rgba(180,60,60,.15);color:var(--red);padding:2px 10px;border-radius:40px;margin-left:6px">已禁用</span>';
   list.innerHTML+='<div class="dl-item"'+disabledCls+' data-enabled="'+enabled+'"><div class="dl-info"><i class="fas '+icon+'"></i><span>'+item.name+badge+'</span></div><a href="'+(hasUrl&&enabled?item.url:'#')+'" class="dl-link" target="'+(hasUrl&&enabled?'_blank':'_self')+'" data-url="'+(item.url||'')+'" data-enabled="'+enabled+'"><i class="fas fa-external-link-alt"></i> '+(enabled?'下载':'已禁用')+'</a></div>';
  });
  // 整个下载列表的事件委托——点禁用项整栏都触发
  $('downloadList').onclick=function(e){
   const item=e.target.closest('.dl-item');

let chartDays=7,chartTimer=null;
async function loadTraffic(){
 try{
  const d=await call('/admin/traffic?days='+chartDays);
  drawTrafficChart(d.traffic||[]);
 }catch(e){}
}
function drawTrafficChart(data){
 const c=$('trafficChart');if(!c)return;
 const ctx=c.getContext('2d');
 c.width=c.parentElement.clientWidth-8||800;
 c.height=Math.min(c.width*0.4,340);
 if(!data.length){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='rgba(200,200,200,.3)';ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText('暂无数据',c.width/2,c.height/2);return}
 const pad={t:25,b:20,l:45,r:15},w=c.width-pad.l-pad.r,h=c.height-pad.t-pad.b;
 const max=Math.max(...data.map(d=>d.bytes),1);
 ctx.clearRect(0,0,c.width,c.height);
 const isDark=document.documentElement.getAttribute('data-theme')==='dark';
 const lineCol=isDark?'rgba(88,166,255,.85)':'rgba(42,75,122,.75)';
 const fillCol=isDark?'rgba(88,166,255,.15)':'rgba(42,75,122,.1)';
 const dotCol=isDark?'rgba(88,166,255,1)':'rgba(42,75,122,.95)';
 const gridCol=isDark?'rgba(255,255,255,.06)':'rgba(0,0,0,.05)';
 const txtCol=isDark?'rgba(255,255,255,.25)':'rgba(0,0,0,.2)';
 ctx.strokeStyle=gridCol;ctx.lineWidth=1;
 for(let i=0;i<=4;i++){
  const y=pad.t+h*(1-i/4);
  ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w+pad.l,y);ctx.stroke();
  ctx.fillStyle=txtCol;ctx.font='11px sans-serif';ctx.textAlign='right';
  const val=Math.round(max*i/4);
  ctx.fillText(val>=1024?(val/1024).toFixed(1)+'KB':val+'B',pad.l-8,y+4);
 }
 const xStep=w/(data.length-1||1);
 ctx.beginPath();
 data.forEach((d,i)=>{
  const x=pad.l+i*xStep,y=pad.t+h*(1-d.bytes/max);
  i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
 });
 ctx.strokeStyle=lineCol;ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
 ctx.lineTo(pad.l+(data.length-1)*xStep,pad.t+h);
 ctx.lineTo(pad.l,pad.t+h);
 ctx.closePath();
 ctx.fillStyle=fillCol;ctx.fill();
 data.forEach((d,i)=>{
  const x=pad.l+i*xStep,y=pad.t+h*(1-d.bytes/max);
  ctx.beginPath();ctx.arc(x,y,d.bytes>0?4:0,0,Math.PI*2);ctx.fillStyle=dotCol;ctx.fill();
  if(data.length<=10||i%Math.ceil(data.length/7)===0||i===data.length-1||i===0){
   ctx.fillStyle=txtCol;ctx.font='10px sans-serif';ctx.textAlign='center';
   ctx.fillText(d.date,x,y+16);
  }
 });
}

// ---- 悬浮返回按钮（可拖拽）—— 使用 Pointer Events ----
(function(){
 const btn=document.getElementById('exitBtn');
 if(!btn)return;
 let isDragging=false,dragStarted=false,offX=0,offY=0;
 let fixedX=window.innerWidth-78,fixedY=window.innerHeight-138;
 // 安全恢复上次位置
 try{
  const saved=localStorage.getItem('zy-exit-pos');
  if(saved){
   const p=JSON.parse(saved);
   if(typeof p.x==='number'&&typeof p.y==='number'&&p.x>=0&&p.y>=0){
    fixedX=p.x;fixedY=p.y;
   }
  }
 }catch(e){}
 function syncPos(){btn.style.left=fixedX+'px';btn.style.top=fixedY+'px'}
 btn.addEventListener('pointerdown',function(e){
  isDragging=true;dragStarted=false;
  offX=e.clientX-fixedX;
  offY=e.clientY-fixedY;
  btn.style.cursor='grabbing';
  e.preventDefault();
 });
 document.addEventListener('pointermove',function(e){
  if(!isDragging)return;
  dragStarted=true;
  let x=e.clientX-offX,y=e.clientY-offY;
  if(isNaN(x)||isNaN(y))return;
  x=Math.max(0,Math.min(x,window.innerWidth-btn.offsetWidth));
  y=Math.max(0,Math.min(y,window.innerHeight-btn.offsetHeight));
  fixedX=x;fixedY=y;syncPos();
 });
 document.addEventListener('pointerup',function(){
  if(!isDragging)return;
  isDragging=false;
  btn.style.cursor='grab';
  if(dragStarted){
   localStorage.setItem('zy-exit-pos',JSON.stringify({x:fixedX,y:fixedY}));
  }else{
   // 纯点击（未拖拽）→ 退出面板
   document.getElementById('adminPanel').classList.remove('active');
   document.getElementById('normalView').style.display='grid';
   status('👤 返回','fa-arrow-left','#1f5a7a');
  }
 });
 btn.addEventListener('pointercancel',function(){
  isDragging=false;btn.style.cursor='grab';
 });
 // 滚动时同步位置
 window.addEventListener('scroll',syncPos);
 // 监控管理员面板显隐
 new MutationObserver(function(){
  const active=document.getElementById('adminPanel').classList.contains('active');
  btn.classList.toggle('show',active);
  if(active){syncPos()}
 }).observe(document.getElementById('adminPanel'),{attributes:true,attributeFilter:['class']});
 // 点击返回已在 pointerup 中处理
})();

// ---- 粒子动效 ----
(function(){
 const c=$('particleCanvas'),ctx=c.getContext('2d');
 let w,h,particles=[];
 function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
 resize();
 window.addEventListener('resize',resize);
 const count=Math.min(80,Math.floor(w*h/12000));
 for(let i=0;i<count;i++){
  particles.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r:Math.random()*2+1.5});
 }
 let frame=0;
 function draw(){
  frame++;
  ctx.clearRect(0,0,w,h);
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  // 中心脉冲波纹
  const pulse=Math.sin(frame/40)*0.5+0.5;
  const g=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,w*0.4);
  g.addColorStop(0,'rgba(0,200,255,'+pulse*0.08+')');
  g.addColorStop(0.5,'rgba(100,50,255,'+pulse*0.04+')');
  g.addColorStop(1,'rgba(0,200,255,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,w,h);
  // 粒子
  const alpha=isDark?.15:.1;
  for(let p of particles){
   p.x+=p.vx;p.y+=p.vy;
   if(p.x<0)p.x=w;if(p.x>w)p.x=0;
   if(p.y<0)p.y=h;if(p.y>h)p.y=0;
   // 光晕
   ctx.beginPath();
   ctx.arc(p.x,p.y,p.r*3,0,Math.PI*2);
   ctx.fillStyle='rgba(0,180,255,'+alpha*0.15+')';
   ctx.fill();
   // 核心
   ctx.beginPath();
   ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
   ctx.fillStyle='rgba(0,200,255,'+alpha+')';
   ctx.fill();
  }
  // 连线 + 流动数据
  for(let i=0;i<particles.length;i++){
   for(let j=i+1;j<particles.length;j++){
    const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<200){
     const frac=1-dist/200;
     ctx.beginPath();
     ctx.moveTo(particles[i].x,particles[i].y);
     ctx.lineTo(particles[j].x,particles[j].y);
     ctx.strokeStyle='rgba(0,180,255,'+(alpha*frac*0.4)+')';
     ctx.lineWidth=frac*0.8+0.2;
     ctx.stroke();
     // 流动光点
     if(frame%2===0&&frac>0.5&&Math.random()<0.01){
      const t=Math.random();
      ctx.beginPath();
      ctx.arc(particles[i].x+dx*t,particles[i].y+dy*t,2,0,Math.PI*2);
      ctx.fillStyle='rgba(0,255,200,0.6)';
      ctx.fill();
     }
    }
   }
  }
  requestAnimationFrame(draw);
 }
 draw();
})();

(function(){
 const sel='.btn,.btn-sm,.btn-p,.btn-s,.btn-o,.dl-link,.filter-btn,.theme-btn,.bg-btn,.float-exit,.back-to-top,.su,.du,.danger';
 document.addEventListener('click',function(e){

  if(!btn)return;
  const rect=btn.getBoundingClientRect();
  if(rect.width===0||rect.height===0)return;
  const r=document.createElement('span');
  r.className='ripple';
  const size=Math.max(rect.width,rect.height);
  r.style.width=r.style.height=size+'px';
  r.style.left=(e.clientX-rect.left-size/2)+'px';
  r.style.top=(e.clientY-rect.top-size/2)+'px';
  btn.classList.add('ripple-wrap');
  btn.appendChild(r);
  r.addEventListener('animationend',function(){r.remove()});
 });
})();
