<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>子云专属网站 · 管理员面板</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, rgba(200, 220, 255, 0.25), rgba(230, 240, 255, 0.10)), 
                        linear-gradient(145deg, #f7faff 0%, #eef3fc 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .glass-card {
            max-width: 1300px;
            width: 100%;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(14px) saturate(180%);
            border-radius: 56px;
            padding: 2.2rem 2.5rem;
            box-shadow: 0 30px 60px rgba(0, 20, 40, 0.12), 0 8px 24px rgba(0, 0, 0, 0.03), inset 0 1px 2px rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            padding-bottom: 1rem;
        }
        .brand h1 {
            font-weight: 500;
            font-size: 2.4rem;
            letter-spacing: 2px;
            color: #1b2b4a;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand h1 i { color: #2a4b7a; font-size: 2rem; }
        .admin-badge {
            background: rgba(30, 60, 120, 0.18);
            backdrop-filter: blur(4px);
            padding: 8px 20px;
            border-radius: 60px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #1f3a5f;
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-badge i { color: #c97d2b; }
        .grid-2col {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr;
            gap: 2.5rem;
            margin-top: 0.5rem;
        }
        @media (max-width: 820px) {
            .glass-card { padding: 1.5rem 1.2rem; }
            .grid-2col { grid-template-columns: 1fr; gap: 2.2rem; }
            .brand h1 { font-size: 2rem; }
        }
        .download-section {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            border-radius: 36px;
            padding: 1.8rem 1.8rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .download-section h2 {
            font-weight: 400;
            font-size: 1.6rem;
            color: #1d334f;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.6rem;
        }
        .download-desc { color: #1f3a57; opacity: 0.9; margin-bottom: 1.8rem; font-size: 0.98rem; }
        .download-items { display: flex; flex-direction: column; gap: 16px; }
        .download-item {
            background: rgba(240, 248, 255, 0.3);
            backdrop-filter: blur(4px);
            border-radius: 30px;
            padding: 12px 22px;
            border: 1px solid rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            transition: 0.2s;
        }
        .download-item:hover { background: rgba(255, 255, 255, 0.5); }
        .download-info { display: flex; align-items: center; gap: 14px; }
        .download-info i { font-size: 1.6rem; color: #2a4f7a; width: 30px; }
        .download-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(40, 80, 140, 0.12);
            padding: 8px 22px 8px 18px;
            border-radius: 60px;
            color: #1f3d66;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: 0.2s;
            cursor: pointer;
        }
        .download-link:hover { background: rgba(50, 100, 180, 0.25); border-color: rgba(255, 255, 255, 0.9); }
        .account-section {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            border-radius: 36px;
            padding: 1.8rem 1.8rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .account-section h2 {
            font-weight: 400;
            font-size: 1.6rem;
            color: #1d334f;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.2rem;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1a3552;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 60px;
            font-size: 1rem;
            color: #102b44;
            outline: none;
            transition: 0.2s;
        }
        .form-group input:focus { background: rgba(255, 255, 255, 0.7); border-color: #6d93c9; }
        .form-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .form-row .form-group { flex: 1 0 120px; }
        .btn {
            padding: 12px 24px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(6px);
            font-weight: 500;
            font-size: 1rem;
            color: #1d3857;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            flex: 1 1 auto;
        }
        .btn-primary {
            background: rgba(50, 100, 180, 0.25);
            border-color: rgba(70, 130, 200, 0.4);
            color: #16406b;
        }
        .btn-primary:hover { background: rgba(50, 100, 180, 0.4); }
        .btn-success {
            background: rgba(30, 140, 80, 0.2);
            border-color: rgba(40, 160, 100, 0.3);
            color: #0d462b;
        }
        .btn-success:hover { background: rgba(30, 160, 90, 0.3); }
        .btn-outline { background: transparent; }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.4); }
        .status-message {
            margin-top: 18px;
            padding: 12px 18px;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            color: #1f3a5a;
            min-height: 52px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-hint {
            background: rgba(200, 170, 100, 0.15);
            border: 1px solid rgba(220, 180, 80, 0.25);
            border-radius: 60px;
            padding: 8px 18px;
            font-size: 0.8rem;
            color: #4d3f1f;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }
        .footer-note {
            margin-top: 2rem;
            text-align: right;
            font-size: 0.8rem;
            color: #385578;
            opacity: 0.6;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 1rem;
        }
        .admin-panel {
            display: none;
            margin-top: 1.2rem;
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 1.8rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .admin-panel.active { display: block; }
        .admin-panel h3 {
            font-weight: 400;
            font-size: 1.6rem;
            color: #1a3250;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 1.8rem;
            border-bottom: 1px dashed rgba(255,255,255,0.4);
            padding-bottom: 0.8rem;
        }
        .admin-panel h3 i { color: #b8862b; }
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            border-radius: 28px;
            padding: 1.2rem 1.5rem;
            border: 1px solid rgba(255,255,255,0.5);
            text-align: center;
        }
        .stat-card i { font-size: 2rem; color: #2a5f8a; margin-bottom: 6px; display: block; }
        .stat-card .number { font-size: 2rem; font-weight: 500; color: #0b2642; }
        .stat-card .label { font-size: 0.85rem; color: #2b4a6e; opacity: 0.8; }
        .admin-table-wrap {
            overflow-x: auto;
            margin: 1.2rem 0 0.8rem;
            border-radius: 28px;
            background: rgba(255,255,255,0.15);
            padding: 0.2rem;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        .admin-table th {
            text-align: left;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.25);
            color: #102b44;
            font-weight: 500;
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }
        .admin-table td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            color: #1a3350;
        }
        .admin-table tr:last-child td { border-bottom: none; }
        .admin-table .edit-input {
            background: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.9rem;
            width: 100%;
            max-width: 140px;
            color: #102b44;
        }
        .admin-table .edit-input:focus {
            background: rgba(255,255,255,0.7);
            border-color: #6d93c9;
            outline: none;
        }
        .btn-sm {
            padding: 6px 16px;
            font-size: 0.85rem;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: 0.2s;
            color: #1f3d66;
        }
        .btn-sm:hover { background: rgba(255,255,255,0.5); }
        .btn-sm.danger { color: #a1443a; border-color: rgba(180, 70, 50, 0.3); }
        .btn-sm.danger:hover { background: rgba(200, 80, 60, 0.15); }
        .recent-log {
            background: rgba(255,255,255,0.15);
            border-radius: 28px;
            padding: 0.8rem 1.5rem;
            margin-top: 1.2rem;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 0.95rem;
            color: #1b3554;
        }
        .recent-log i { margin-right: 10px; color: #3f6a8f; }
        @media (max-width: 600px) {
            .admin-stats { grid-template-columns: 1fr 1fr; }
            .admin-table .edit-input { max-width: 100px; }
        }
        /* Toast 提示 */
        .toast-message {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 50, 80, 0.85);
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 16px 32px;
            border-radius: 60px;
            font-size: 1rem;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 999;
            display: none;
            align-items: center;
            gap: 14px;
            animation: fadeSlideDown 0.3s ease;
            pointer-events: none;
        }
        .toast-message i { font-size: 1.4rem; }
        .toast-message.show { display: flex; }
        @keyframes fadeSlideDown {
            0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
<div class="glass-card" id="appContainer">
    <!-- 头部 -->
    <div class="brand">
        <h1><i class="fas fa-cloud"></i> 子云专属网站</h1>
        <div class="admin-badge" id="adminBadge">
            <i class="fas fa-user-shield"></i> 
            <span id="adminBadgeText">未登录</span>
            <i class="fas fa-crown" style="margin-left: 4px; color: #c97d2b;"></i>
        </div>
    </div>

    <!-- 双栏视图 -->
    <div class="grid-2col" id="normalView">
        <!-- 下载区 -->
        <div class="download-section">
            <h2><i class="fas fa-download"></i> 下载中心</h2>
            <div class="download-desc"><i class="fas fa-arrow-right" style="margin-right: 6px;"></i> 登录后点击下载即可获取文件</div>
            <div class="download-items">
                <div class="download-item">
                    <div class="download-info"><i class="fas fa-file-archive"></i><span>子云工具包 v2.6</span></div>
                    <a href="#" class="download-link" data-package="子云工具包 v2.6" data-file="子云工具包_v2.6.zip"><i class="fas fa-cloud-download-alt"></i> 下载</a>
                </div>
                <div class="download-item">
                    <div class="download-info"><i class="fas fa-code"></i><span>子云开发者套件</span></div>
                    <a href="#" class="download-link" data-package="子云开发者套件" data-file="子云开发者套件.zip"><i class="fas fa-cloud-download-alt"></i> 下载</a>
                </div>
                <div class="download-item">
                    <div class="download-info"><i class="fas fa-mobile-alt"></i><span>子云移动端</span></div>
                    <a href="#" class="download-link" data-package="子云移动端" data-file="子云移动端.apk"><i class="fas fa-cloud-download-alt"></i> 下载</a>
                </div>
            </div>
            <div style="margin-top: 18px; background: rgba(255,255,245,0.2); border-radius: 40px; padding: 6px 18px; border: 1px dashed rgba(255,255,255,0.3); font-size:0.85rem; color:#1a3f5c;">
                <i class="fas fa-info-circle"></i> 请先登录账户再下载

        </div>

        <!-- 账户区 -->
        <div class="account-section" id="accountSection">
            <h2><i class="fas fa-user-circle"></i> 账户</h2>
            <div class="form-group">
                <label><i class="far fa-user"></i> 用户名</label>
                <input type="text" id="usernameInput" placeholder="用户名" value="admin">
            </div>

                <input type="password" id="passwordInput" placeholder="密码" value="admin123">

                <div class="form-group">

                </div>
            </div>
            <div class="status-message" id="statusMessage">
                <i class="fas fa-comment-dots"></i> 
                <span id="statusText">就绪 · 默认管理员 admin/admin123</span>
            </div>
            <div id="adminPrivilegeArea" style="margin-top: 12px; display: none;">
                <div class="admin-hint"><i class="fas fa-star"></i> 高级权限已激活</div>
            </div>
            <div style="margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap;">

    <!-- 管理员面板 -->
    <div class="admin-panel" id="adminPanel">
        <h3><i class="fas fa-sliders-h"></i> 管理员控制面板</h3>
        <div class="admin-stats" id="statsContainer">
            <div class="stat-card"><i class="fas fa-users"></i><div class="number" id="totalUsers">0</div><div class="label">总账户</div></div>
            <div class="stat-card"><i class="fas fa-user-check"></i><div class="number" id="recentLogins">0</div><div class="label">近期登录 (24h)</div></div>
            <div class="stat-card"><i class="fas fa-tachometer-alt"></i><div class="number" id="trafficUsage">0 MB</div><div class="label">网站流量 (今日)</div></div>

        <div class="admin-table-wrap">

<!-- Toast 提示 -->
<div class="toast-message" id="toastMessage">
    <i class="fas fa-info-circle"></i>
    <span id="toastText">请先登录</span>
</div>

<script>
    (function() {
        // ============================================================
        // ★★★ 配置区域：请根据实际情况修改 ★★★
        // ============================================================
        
        // 1. 文件映射：将显示名称映射到真实文件路径
        //    将您的压缩包放到网站目录下（例如 /downloads/ 文件夹）
        //    然后修改下面的路径
        const fileMap = {
            '子云工具包 v2.6': {
                fileName: '子云工具包_v2.6.zip',
                // ★★★ 修改为您的真实文件路径 ★★★
                // 示例1：文件在网站根目录的 downloads 文件夹下
                path: '/downloads/子云工具包_v2.6.zip'
                // 示例2：文件在桌面（需配置虚拟目录或使用后端代理）
                // path: '/files/子云工具包_v2.6.zip'
            },
            '子云开发者套件': {
                fileName: '子云开发者套件.zip',
                path: '/downloads/子云开发者套件.zip'
            },
            '子云移动端': {
                fileName: '子云移动端.apk',
                path: '/downloads/子云移动端.apk'
            }
        };

        // 2. 如果您想直接从桌面路径提供下载（不推荐，需要配置虚拟目录）
        //    或者使用 PHP 代理，请参考下面的注释代码
        /*
        // PHP 代理方式（需要创建 download.php）
        const fileMap = {
            '子云工具包 v2.6': {
                fileName: '子云工具包_v2.6.zip',
                path: 'download.php?file=子云工具包_v2.6.zip'
            }
        };
        */

        // ============================================================
        // 数据层
        // ============================================================
        const DB_KEY = 'ziyun_users';
        const LOG_KEY = 'ziyun_login_log';
        const TRAFFIC_KEY = 'ziyun_traffic';
        const DEFAULT_ADMIN = { username: 'admin', password: 'admin123', role: 'admin' };

        function initUsers() {
            let users = JSON.parse(localStorage.getItem(DB_KEY));
            if (!users || !Array.isArray(users) || users.length === 0) {
                users = [DEFAULT_ADMIN];
                localStorage.setItem(DB_KEY, JSON.stringify(users));
            } else {
                const hasAdmin = users.some(u => u.username === 'admin' && u.role === 'admin');
                if (!hasAdmin) {
                    users.push(DEFAULT_ADMIN);
                    localStorage.setItem(DB_KEY, JSON.stringify(users));
                }
            }
            return users;
        }
        initUsers();

        function getUsers() {
            try {
                return JSON.parse(localStorage.getItem(DB_KEY)) || [];
            } catch(e) {
                return [];
            }
        }
        function saveUsers(users) {
            localStorage.setItem(DB_KEY, JSON.stringify(users));
        }

        function getLoginLog() {
            try {
                return JSON.parse(localStorage.getItem(LOG_KEY)) || [];
            } catch(e) {
                return [];
            }
        }
        function addLoginLog(username) {
            const log = getLoginLog();
            log.unshift({ username, time: new Date().toLocaleString() });
            if (log.length > 20) log.length = 20;
            localStorage.setItem(LOG_KEY, JSON.stringify(log));
        }
        function getRecentLogins(hours = 24) {
            const log = getLoginLog();
            const now = Date.now();
            return log.filter(entry => {
                try {
                    const t = new Date(entry.time).getTime();
                    return (now - t) < hours * 3600 * 1000;
                } catch(e) { return false; }
            });
        }

        function getTraffic() {
            try {
                let traffic = JSON.parse(localStorage.getItem(TRAFFIC_KEY));
                if (!traffic || typeof traffic !== 'object') {
                    traffic = { today: 0, date: new Date().toDateString() };
                    localStorage.setItem(TRAFFIC_KEY, JSON.stringify(traffic));
                } else if (traffic.date !== new Date().toDateString()) {
                    traffic.today = 0;
                    traffic.date = new Date().toDateString();
                    localStorage.setItem(TRAFFIC_KEY, JSON.stringify(traffic));
                }
                return traffic;
            } catch(e) {
                return { today: 0, date: new Date().toDateString() };
            }
        }
        function addTraffic(bytes) {
            const traffic = getTraffic();
            traffic.today += bytes;
            localStorage.setItem(TRAFFIC_KEY, JSON.stringify(traffic));
        }
        function simulateTraffic() {
            addTraffic(Math.floor(Math.random() * 300) + 50);
        }
        simulateTraffic();

        // ============================================================
        // 全局状态
        // ============================================================
        let currentUser = null;

        // DOM 引用
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const statusText = document.getElementById('statusText');
        const statusMessage = document.getElementById('statusMessage');
        const adminPrivilegeArea = document.getElementById('adminPrivilegeArea');
        const adminBadgeText = document.getElementById('adminBadgeText');
        const adminPanel = document.getElementById('adminPanel');
        const normalView = document.getElementById('normalView');
        const userTableBody = document.getElementById('userTableBody');
        const totalUsersEl = document.getElementById('totalUsers');
        const recentLoginsEl = document.getElementById('recentLogins');
        const trafficUsageEl = document.getElementById('trafficUsage');
        const recentLogText = document.getElementById('recentLogText');
        const toastMessage = document.getElementById('toastMessage');
        const toastText = document.getElementById('toastText');

        // ============================================================
        // Toast 提示
        // ============================================================
        let toastTimer = null;
        function showToast(msg, icon = 'fa-info-circle', duration = 3000) {
            toastText.textContent = msg;
            const iconEl = toastMessage.querySelector('i');
            if (iconEl) iconEl.className = 'fas ' + icon;
            toastMessage.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastMessage.classList.remove('show');
            }, duration);
        }

        // ============================================================
        // UI 函数
        // ============================================================
        function setStatus(msg, icon = 'fa-comment-dots', color = '#1f3a5a') {
            statusText.innerText = msg;
            statusMessage.style.color = color;
            const iconEl = statusMessage.querySelector('i');
            if (iconEl) iconEl.className = 'fas ' + icon;
            console.log('[Status]', msg);
        }

        function renderAdminPanel() {
            if (!currentUser || currentUser.role !== 'admin') {
                adminPanel.classList.remove('active');
                normalView.style.display = 'grid';
                return;
            }
            adminPanel.classList.add('active');
            normalView.style.display = 'none';

            const users = getUsers();
            totalUsersEl.textContent = users.length;
            const recent = getRecentLogins(24);
            recentLoginsEl.textContent = recent.length;
            const traffic = getTraffic();
            trafficUsageEl.textContent = (traffic.today / 1024).toFixed(1) + ' MB';

            renderUserTable(users);

            const log = getLoginLog();
            if (log.length === 0) {
                recentLogText.textContent = '暂无登录记录';
            } else {
                const latest = log.slice(0, 5).map(e => `${e.username} (${e.time})`).join('; ');
                recentLogText.textContent = '最近登录: ' + latest;
            }
        }

        function renderUserTable(users) {
            userTableBody.innerHTML = '';
            users.forEach((user, index) => {
                const tr = document.createElement('tr');
                const tdUser = document.createElement('td');
                tdUser.textContent = user.username;
                const tdPass = document.createElement('td');
                const passInput = document.createElement('input');
                passInput.type = 'text';
                passInput.className = 'edit-input';
                passInput.value = user.password || '';
                passInput.dataset.index = index;
                passInput.dataset.field = 'password';
                tdPass.appendChild(passInput);
                const tdRole = document.createElement('td');
                const roleInput = document.createElement('input');
                roleInput.type = 'text';
                roleInput.className = 'edit-input';
                roleInput.value = user.role || 'user';
                roleInput.dataset.index = index;
                roleInput.dataset.field = 'role';
                tdRole.appendChild(roleInput);
                const tdAction = document.createElement('td');
                const saveBtn = document.createElement('button');
                saveBtn.className = 'btn-sm';
                saveBtn.innerHTML = '<i class="fas fa-save"></i> 保存';
                saveBtn.dataset.index = index;
                saveBtn.addEventListener('click', function(e) {
                    const idx = parseInt(this.dataset.index);
                    const usersNow = getUsers();
                    if (idx >= usersNow.length) return;
                    const newPass = document.querySelector(`input[data-index="${idx}"][data-field="password"]`).value;
                    const newRole = document.querySelector(`input[data-index="${idx}"][data-field="role"]`).value;
                    if (usersNow[idx].username === 'admin') {
                        if (newRole !== 'admin') {
                            alert('⚠️ 管理员角色不可变更');
                            renderAdminPanel();
                            return;
                        }
                    }
                    usersNow[idx].password = newPass;
                    usersNow[idx].role = newRole;
                    saveUsers(usersNow);
                    setStatus('✅ 账户更新成功', 'fa-check-circle', '#1f7a5a');
                    renderAdminPanel();
                });
                const delBtn = document.createElement('button');
                delBtn.className = 'btn-sm danger';
                delBtn.innerHTML = '<i class="fas fa-trash"></i>';
                delBtn.dataset.index = index;
                delBtn.style.marginLeft = '6px';
                delBtn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    const usersNow = getUsers();
                    if (usersNow[idx].username === 'admin') {
                        alert('❌ 不能删除管理员账户');
                        return;
                    }
                    if (confirm(`确定删除用户 "${usersNow[idx].username}" ？`)) {
                        usersNow.splice(idx, 1);
                        saveUsers(usersNow);
                        setStatus('🗑️ 用户已删除', 'fa-trash', '#a1443a');
                        renderAdminPanel();
                    }
                });
                tdAction.appendChild(saveBtn);
                tdAction.appendChild(delBtn);
                tr.appendChild(tdUser);
                tr.appendChild(tdPass);
                tr.appendChild(tdRole);
                tr.appendChild(tdAction);
                userTableBody.appendChild(tr);
            });
        }

        function updateUI() {
            if (currentUser) {
                const isAdmin = currentUser.role === 'admin';
                adminBadgeText.innerText = isAdmin ? '管理员 (高级)' : currentUser.username;
                if (isAdmin) {
                    adminPrivilegeArea.style.display = 'block';
                    setStatus(`✅ 管理员 ${currentUser.username}`, 'fa-crown', '#b8862b');
                    renderAdminPanel();
                } else {
                    adminPrivilegeArea.style.display = 'none';
                    adminPanel.classList.remove('active');
                    normalView.style.display = 'grid';
                    setStatus(`👤 已登录: ${currentUser.username}`, 'fa-user', '#1f5a7a');
                }
                usernameInput.value = currentUser.username;
                passwordInput.value = '';
            } else {
                adminPrivilegeArea.style.display = 'none';
                adminPanel.classList.remove('active');
                normalView.style.display = 'grid';
                adminBadgeText.innerText = '未登录';
                setStatus('🔓 未登录 · 请注册或登录', 'fa-comment-dots', '#4d6a8a');
            }
        }

        // ============================================================
        // 核心操作
        // ============================================================
        function register() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            if (!username || !password) {
                setStatus('⚠️ 用户名和密码不能为空', 'fa-exclamation-triangle', '#b5653b');
                return;
            }
            if (username.length < 3) {
                setStatus('⚠️ 用户名至少3个字符', 'fa-exclamation-triangle', '#b5653b');
                return;
            }
            const users = getUsers();
            if (users.some(u => u.username === username)) {
                setStatus('❌ 用户名已存在', 'fa-times-circle', '#b13e3e');
                return;
            }
            users.push({ username, password, role: 'user' });
            saveUsers(users);
            setStatus(`✅ 注册成功！请登录 (${username})`, 'fa-check-circle', '#2a7a4a');
            passwordInput.value = '';
            showToast(`✅ 注册成功！请登录 ${username}`, 'fa-check-circle', 2500);
        }

        function login() {
            console.log('[Login] 开始执行登录...');
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            console.log('[Login] 输入:', username, password);
            
            if (!username || !password) {
                setStatus('⚠️ 请输入用户名和密码', 'fa-exclamation-triangle', '#b5653b');
                showToast('⚠️ 请输入用户名和密码', 'fa-exclamation-triangle', 2000);
                return;
            }
            
            const users = getUsers();
            console.log('[Login] 当前用户列表:', users);
            
            const found = users.find(u => u.username === username && u.password === password);
            console.log('[Login] 查找结果:', found);
            
            if (!found) {
                setStatus('❌ 用户名或密码错误', 'fa-times-circle', '#b13e3e');
                showToast('❌ 用户名或密码错误', 'fa-times-circle', 2000);
                return;
            }
            
            currentUser = { username: found.username, role: found.role || 'user' };
            addLoginLog(username);
            addTraffic(120);
            updateUI();
            setStatus(`✅ 登录成功！欢迎 ${found.username}`, 'fa-check-circle', '#1f7a5a');
            passwordInput.value = '';
            showToast(`✅ 欢迎回来，${found.username}！`, 'fa-check-circle', 2000);
            console.log('[Login] 登录成功，当前用户:', currentUser);
        }

        function logout() {
            currentUser = null;
            updateUI();
            setStatus('🔓 已退出', 'fa-sign-out-alt', '#4d6a8a');
            passwordInput.value = '';
            showToast('🔓 已退出登录', 'fa-sign-out-alt', 2000);
        }

        // ============================================================
        // ★★★ 下载处理（带登录判定 + 真实文件下载）★★★
        // ============================================================
        function handleDownload(e, link) {
            e.preventDefault();
            e.stopPropagation();
            
            const packageName = link.getAttribute('data-package') || '子云软件';
            
            // ★ 登录判定：未登录则提示
            if (!currentUser) {
                showToast('🔒 请先登录账户再下载', 'fa-lock', 3000);
                setStatus('🔒 请先登录再下载', 'fa-lock', '#b5653b');
                // 高亮账户区域
                document.getElementById('accountSection').style.transition = '0.3s';
                document.getElementById('accountSection').style.boxShadow = '0 0 0 3px rgba(200, 100, 50, 0.3)';
                setTimeout(() => {
                    document.getElementById('accountSection').style.boxShadow = 'none';
                }, 2000);
                return;
            }
            
            // 获取文件信息
            const fileInfo = fileMap[packageName];
            if (!fileInfo) {
                showToast('❌ 文件配置错误，请联系管理员', 'fa-exclamation-triangle', 3000);
                setStatus('❌ 文件配置错误', 'fa-exclamation-triangle', '#b13e3e');
                console.error('[Download] 未找到文件配置:', packageName);
                return;
            }
            
            showToast(`📦 开始下载: ${packageName}`, 'fa-download', 2500);
            setStatus(`⬇️ 正在下载: ${packageName}`, 'fa-download', '#2a6b9c');
            
            // ★★★ 真实下载 ★★★
            try {
                const downloadUrl = fileInfo.path;
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = fileInfo.fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                // 记录流量（随机模拟）
                const trafficSize = Math.floor(Math.random() * 500) + 200;
                addTraffic(trafficSize);
                console.log('[Download] 下载成功:', packageName, '流量:', trafficSize, 'KB');
            } catch(err) {
                console.error('[Download] 下载失败:', err);
                showToast('❌ 下载失败，请稍后重试', 'fa-exclamation-triangle', 3000);
                setStatus('❌ 下载失败', 'fa-times-circle', '#b13e3e');
            }
        }

        // ============================================================
        // 事件绑定
        // ============================================================
        console.log('[Init] 开始初始化...');

        // 登录按钮
        const loginBtn = document.getElementById('loginBtn');
        if (loginBtn) {
            const newLoginBtn = loginBtn.cloneNode(true);
            loginBtn.parentNode.replaceChild(newLoginBtn, loginBtn);
            newLoginBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('[Event] 登录按钮被点击');
                login();
            });
            console.log('[Event] 登录按钮绑定成功');
        }

        // 注册按钮
        const registerBtn = document.getElementById('registerBtn');
        if (registerBtn) {
            const newRegisterBtn = registerBtn.cloneNode(true);
            registerBtn.parentNode.replaceChild(newRegisterBtn, registerBtn);
            newRegisterBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('[Event] 注册按钮被点击');
                register();
            });
            console.log('[Event] 注册按钮绑定成功');
        }

        // 退出按钮
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            const newLogoutBtn = logoutBtn.cloneNode(true);
            logoutBtn.parentNode.replaceChild(newLogoutBtn, logoutBtn);
            newLogoutBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('[Event] 退出按钮被点击');
                logout();
            });
            console.log('[Event] 退出按钮绑定成功');
        }

        // 刷新面板
        const refreshAdminBtn = document.getElementById('refreshAdminBtn');
        if (refreshAdminBtn) {
            const newRefreshBtn = refreshAdminBtn.cloneNode(true);
            refreshAdminBtn.parentNode.replaceChild(newRefreshBtn, refreshAdminBtn);
            newRefreshBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('[Event] 刷新面板');
                if (currentUser && currentUser.role === 'admin') {
                    renderAdminPanel();
                    setStatus('🔄 面板已刷新', 'fa-sync', '#2a5f8a');
                    showToast('🔄 面板已刷新', 'fa-sync', 1500);
                } else {
                    showToast('⛔ 请先登录管理员', 'fa-exclamation-triangle', 2000);
                }
            });
        }

        // 退出管理
        const exitAdminBtn = document.getElementById('exitAdminBtn');
        if (exitAdminBtn) {
            const newExitBtn = exitAdminBtn.cloneNode(true);
            exitAdminBtn.parentNode.replaceChild(newExitBtn, exitAdminBtn);
            newExitBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('[Event] 退出管理');
                if (currentUser) {
                    adminPanel.classList.remove('active');
                    normalView.style.display = 'grid';
                    setStatus(`👤 返回普通视图: ${currentUser.username}`, 'fa-arrow-left', '#1f5a7a');
                    showToast('👤 返回普通视图', 'fa-arrow-left', 1500);
                }
            });
        }

        // ★ 下载链接绑定（带登录判定）
        document.querySelectorAll('.download-link').forEach(link => {
            const newLink = link.cloneNode(true);
            link.parentNode.replaceChild(newLink, link);
            newLink.addEventListener('click', function(e) {
                handleDownload(e, this);
            });
        });
        console.log('[Event] 下载链接绑定完成 (带登录判定 + 真实文件)');

        // 回车键支持
        const passInput = document.getElementById('passwordInput');
        if (passInput) {
            passInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    console.log('[Event] 回车触发登录');
                    login();
                }
            });
        }
        const userInput = document.getElementById('usernameInput');
        if (userInput) {
            userInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    console.log('[Event] 回车触发登录');
                    login();
                }
            });
        }

        // ============================================================
        // 初始化
        // ============================================================
        currentUser = null;
        updateUI();
        console.log('[Init] 初始化完成');
        console.log('[Init] 默认管理员: admin / admin123');
        console.log('[Init] 文件映射配置:', fileMap);
        
        // 检查文件配置是否有效
        let hasValidConfig = false;
        for (const key in fileMap) {
            if (fileMap[key] && fileMap[key].path) {
                hasValidConfig = true;
                break;
            }
        }
        if (!hasValidConfig) {
            console.warn('[Init] ⚠️ 警告: 未配置任何文件路径，请修改 fileMap');
            showToast('⚠️ 请先配置下载文件路径', 'fa-exclamation-triangle', 4000);
        } else {
            console.log('[Init] ✅ 文件配置有效');
        }

        // 调试函数
        window.debugLogin = function() {
            console.log('手动触发登录测试');
            login();
        };
        window.debugFileMap = fileMap;
        console.log('[Init] 调试: 输入 debugLogin() 测试登录');
        console.log('[Init] 调试: 输入 debugFileMap 查看文件配置');

    })();
</script>
</body>
</html>
